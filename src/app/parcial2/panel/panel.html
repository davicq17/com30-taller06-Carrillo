@if (producto(); as p) {

  <div class="place-detail-container">

    <article class="place-card">

      <div class="card-header">
        <h3>{{ p.codigo }}</h3>
        <span class="status">Registrado</span>
      </div>

      <div class="place-details">
        <span>Cantidad: {{ p.cantidad }}</span>
        <span>Desde: {{ p.desde }}</span>
        <span>Hasta: {{ p.hasta }}</span>
        <span>Bloques: {{ bloque() }}</span>
        <span>Margen: {{ margen() }}</span>
      </div>

      <div class="card-actions">
        <a class="detail-button" [routerLink]="volver()">
          Cerrar panel
        </a>
      </div>

    </article>

  </div>

} @else {

  <div class="place-detail-container">
    <div class="not-found-place">
      <h3>Producto no encontrado</h3>
      <p>No existe un producto con el código <b>{{ codigo() }}</b>.</p>
      <a class="detail-button" [routerLink]="volver()">Cerrar panel</a>
    </div>
  </div>

}
